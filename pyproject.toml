[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf2ov"
version = "0.1.0"
description = "Convert GGUF checkpoints into uncompressed OpenVINO IR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.13",
    "transformers>=5.5.4",
    "gguf>=0.19",
    "openvino>=20246.3",
    "optimum-intel>=2.1.0",
    "accelerate>=1.14.0",
]

[project.scripts]
gguf2ov = "gguf2ov.cli:main"

[tool.setuptools]
# The modules live directly in src/; that directory IS the gguf2ov package, so it installs
# and imports as `gguf2ov` without a redundant src/gguf2ov/ nesting level.
packages = ["gguf2ov"]
package-dir = { gguf2ov = "src" }
